name: SOMA publisher

on:
  schedule:
    - cron: '*/5 * * * *'
      timezone: Europe/Copenhagen
  workflow_dispatch:
    inputs:
      mode:
        description: Safe dry-run or explicit live publish
        type: choice
        options: [dry_run, validate_meta, publish]
        default: dry_run
        required: true
      delivery_type:
        description: Automatic channel to test, or all due channels
        type: choice
        options: [all, instagram_story, facebook_page_feed]
        default: all
        required: true
      draft_id:
        description: Optional exact approved draft ID for a controlled test
        type: string
        default: ''
        required: false

permissions: {}

concurrency:
  group: soma-state-writer
  cancel-in-progress: false
  queue: max

jobs:
  dry_run:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry_run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run live-calendar dry-run
        shell: bash
        env:
          SOMA_DELIVERY_TYPE: ${{ inputs.delivery_type }}
          SOMA_DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          args=(--dry-run)
          if [ "$SOMA_DELIVERY_TYPE" != "all" ]; then
            args+=(--delivery-type "$SOMA_DELIVERY_TYPE")
          fi
          if [ -n "$SOMA_DRAFT_ID" ]; then
            args+=(--draft-id "$SOMA_DRAFT_ID")
          fi
          node outputs/content-planner/publish-due-content.js "${args[@]}"
      - name: Add sanitized summary
        if: always()
        shell: bash
        run: |
          if [ -f state/run-summary.json ]; then
            cat state/run-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

  validate_meta:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_meta'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Meta read-only
        env:
          SOMA_META_ACCESS_TOKEN: ${{ secrets.SOMA_META_ACCESS_TOKEN }}
        run: node outputs/content-planner/validate-meta.js

  publish:
    if: (github.event_name == 'schedule' && vars.PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout verified runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configure state writer identity
        shell: bash
        run: |
          git config user.name "soma-social-publisher[bot]"
          git config user.email "soma-social-publisher[bot]@users.noreply.github.com"
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Publish due content
        shell: bash
        env:
          PUBLISH_ENABLED: 'true'
          SOMA_META_ACCESS_TOKEN: ${{ secrets.SOMA_META_ACCESS_TOKEN }}
          SOMA_ASSET_REPO_TOKEN: ${{ secrets.SOMA_ASSET_REPO_TOKEN }}
          SOMA_EVENT_NAME: ${{ github.event_name }}
          SOMA_DELIVERY_TYPE: ${{ inputs.delivery_type }}
          SOMA_DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          args=(--publish)
          if [ "$SOMA_EVENT_NAME" = "workflow_dispatch" ] && [ "$SOMA_DELIVERY_TYPE" != "all" ]; then
            args+=(--delivery-type "$SOMA_DELIVERY_TYPE")
          fi
          if [ "$SOMA_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SOMA_DRAFT_ID" ]; then
            args+=(--draft-id "$SOMA_DRAFT_ID")
          fi
          node outputs/content-planner/publish-due-content.js "${args[@]}"
      - name: Reconcile publication state
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node outputs/content-planner/sync-operations.js --publication-only
      - name: Persist reconciled drafts
        if: always()
        shell: bash
        run: |
          git config user.name "soma-social-publisher[bot]"
          git config user.email "soma-social-publisher[bot]@users.noreply.github.com"
          git add -- outputs/content-planner/drafts.json outputs/content-planner/approval/drafts-data.js
          git diff --cached --quiet || git commit -m "chore: reconcile SOMA publication"
          git pull --rebase
          git push
      - name: Add sanitized summary
        if: always()
        shell: bash
        run: |
          if [ -f state/run-summary.json ]; then
            cat state/run-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
